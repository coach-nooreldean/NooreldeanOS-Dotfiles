# Configuration file for Calamares - NooreldeanOS
---
modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - userpkglist
      - users
      - displaymanager
      - networkmanager
      - hwclock
      - services-systemd
      - bootloader
      - umount
  - show:
      - finished

branding: nooreldeanos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
