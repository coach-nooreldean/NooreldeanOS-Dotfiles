# ==============================================================================
# NooreldeanOS Ultra-Modern Glass Hyprlock Configuration
# Acrylic blur, dynamic Pywal colors, bilingual typography & media widgets
# ==============================================================================

# Dynamic color integration with Pywal
source = ~/.cache/wal/colors-hyprland.conf

general {
    disable_loading_bar = false
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.90
    brightness = 0.75
    vibrancy = 0.25
    vibrancy_darkness = 0.2
}

# 1. Top Status: Date & Battery
label {
    monitor =
    text = cmd[update:1000] echo "📅 $(date +'%A, %d %B %Y')  •  ⚡ $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo "100")%"
    color = rgba(224, 242, 254, 0.85)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, -35
    halign = center
    valign = top
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.6)
}

# 2. Hero Clock (Large Hour & Minute)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.7)
}

# 3. User Badge Card
label {
    monitor =
    text =   $USER
    color = $color4
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 10
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# 4. Pill Input Field
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1
    outer_color = $color4
    inner_color = rgba(15, 23, 42, 0.75)
    font_color = rgb(241, 245, 249)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##94a3b8">أدخل كلمة المرور / Password...</span></i>
    hide_input = false
    rounding = 26
    check_color = $color2
    fail_color = rgb(239, 68, 68)
    fail_text = <i><span foreground="##ef4444">كلمة المرور خاطئة ($ATTEMPTS)</span></i>
    fail_transition = 300
    capslock_color = rgb(245, 158, 11)
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

# 5. Media Player Widget (Now Playing)
label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '♫  {{title}} - {{artist}}' 2>/dev/null || echo "NooreldeanOS • Zen Kernel"
    color = rgba(148, 163, 184, 0.85)
    font_size = 13
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 40
    halign = center
    valign = bottom
    shadow_passes = 1
    shadow_size = 4
}
