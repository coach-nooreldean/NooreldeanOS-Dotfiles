# NooreldeanOS Live GRUB Configuration
set default="0"
set timeout=15

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod font

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    set gfxmode="auto"
    insmod gfxterm
    terminal_input console
    terminal_output gfxterm
fi

menuentry "🚀 Start NooreldeanOS (Live Hyprland Desktop)" --class nooreldeanos --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_SEARCH_UUID% cow_spacesize=4G copytoram=n quiet splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 fbcon=nodefer
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}

menuentry "⚡ Start NooreldeanOS with NVIDIA Proprietary Drivers" --class nooreldeanos --class nvidia --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_SEARCH_UUID% cow_spacesize=4G copytoram=n nvidia_drm.modeset=1 quiet splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 fbcon=nodefer
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}

menuentry "🛠️ Start NooreldeanOS (RAM Copy Mode - Fast, Eject USB)" --class nooreldeanos --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_SEARCH_UUID% cow_spacesize=4G copytoram=y quiet splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 fbcon=nodefer
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
}

menuentry "🔄 Reboot Computer" {
    reboot
}

menuentry "⏹️ Shutdown Computer" {
    halt
}
