LABEL arch
TEXT HELP
Boot NooreldeanOS on BIOS.
Live Hyprland desktop with Calamares graphical installer.
ENDTEXT
MENU LABEL Start NooreldeanOS (Live Desktop, %ARCH%)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n quiet splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 fbcon=nodefer

LABEL archnvidia
TEXT HELP
Boot NooreldeanOS with NVIDIA Proprietary Drivers.
ENDTEXT
MENU LABEL Start NooreldeanOS (NVIDIA Drivers, %ARCH%)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n nvidia_drm.modeset=1 quiet splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 fbcon=nodefer

LABEL archram
TEXT HELP
Boot NooreldeanOS into RAM (Fast, allows ejecting USB).
ENDTEXT
MENU LABEL Start NooreldeanOS (RAM Copy Mode, %ARCH%)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=y quiet splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 fbcon=nodefer
