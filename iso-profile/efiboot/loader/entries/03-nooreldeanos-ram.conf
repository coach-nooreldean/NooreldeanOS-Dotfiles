title    NooreldeanOS (RAM Copy Mode - Fast, Eject USB)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=y quiet splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 fbcon=nodefer
