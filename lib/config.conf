# ==============================================================================
# NooreldeanOS Installation Settings
# ==============================================================================
# You can modify these default values before running install.sh or post-install.sh

# --- User & System ---
DEFAULT_TIMEZONE="Africa/Cairo"
DEFAULT_HOSTNAME="nooreldeanos"
DEFAULT_USERNAME="nooreldean"

# --- Services ---
ENABLE_DOCKER="Y"
ENABLE_UFW="Y"
ZRAM_SIZE="ram / 2" # Allocate half of RAM size for ZRAM (safe for all systems)

# --- Logs ---
LOG_FILE="/tmp/nooreldeanos-install.log"
