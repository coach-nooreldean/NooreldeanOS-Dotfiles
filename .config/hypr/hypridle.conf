# ==============================================================================
# NooreldeanOS Smart Hypridle Configuration
# Tiered power saving: Dim -> Lock -> DPMS off -> Suspend with media inhibition
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# 1. Dim display slightly after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 20% 2>/dev/null || true
    on-resume = brightnessctl -r 2>/dev/null || true
}

# 2. Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off displays after 6 minutes
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r 2>/dev/null || true
}

# 4. Suspend system after 20 minutes
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
