# NooreldeanOS Hyprland Configuration
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/Start/

source = ~/.config/hypr/colors.conf

################
### MONITORS ###
################
monitor=,preferred,auto,auto

###################
### MY PROGRAMS ###
###################
$terminal = kitty
$fileManager = kitty -e yazi
$menu = rofi -show drun

#################
### AUTOSTART ###
#################
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME QT_STYLE_OVERRIDE
exec-once = awww-daemon &
exec-once = copyq --start-server &
exec-once = waybar &
exec-once = ~/.config/hypr/scripts/startup_wallpaper.sh &
exec-once = udiskie &
exec-once = swaync &
exec-once = swayosd-server &
exec-once = xsettingsd &
exec-once = nm-applet &
exec-once = blueman-applet &

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_STYLE_OVERRIDE,kvantum

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 5
    gaps_out = 15
    border_size = 4
    col.active_border = $color4
    col.inactive_border = $color0
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 16
    rounding_power = 3
    active_opacity = 0.95
    inactive_opacity = 0.85
    shadow {
        enabled = true
        range = 40
        render_power = 4
        color = rgba(00000088)
    }
    blur {
        enabled = true
        size = 12
        passes = 4
        vibrancy = 0.8
        ignore_opacity = true
        new_optimizations = true
        xray = false
    }
}

animations {
    enabled = true
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = spring, 0.4, 0.0, 0.2, 1.15
    animation = windows, 1, 6, overshot, slide
    animation = windowsOut, 1, 5, smoothOut, slide
    animation = windowsMove, 1, 5, overshot, slide
    animation = layers, 1, 5, overshot, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 100, linear, loop
    animation = fade, 1, 5, smoothIn
    animation = workspaces, 1, 7, overshot, slide
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

#############
### INPUT ###
#############
input {
    kb_layout = us,ara
    kb_variant = ,
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap_to_click = true
        clickfinger_behavior = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}


####################
### KEYBINDINGS ###
####################
$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod SHIFT, B, exec, pkill waybar && waybar &
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, ESCAPE, exec, wlogout
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, V, exec, copyq toggle
bind = $mainMod, B, exec, google-chrome-stable

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, Z, togglespecialworkspace, magic
bind = $mainMod SHIFT, Z, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mainMod, S, exec, ~/.config/hypr/scripts/screenshot.sh region
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh output

bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod ALT, W, exec, killall -SIGUSR1 waybar
bind = $mainMod, T, exec, telegram-desktop
bind = $mainMod, C, exec, antigravity-ide
bind = $mainMod SHIFT, C, exec, hyprpicker -a -n

##############################
### WINDOWS AND WORKSPACES ###
##############################
windowrulev2 = float, class:^(hyprland-run)$
windowrulev2 = move 20 100%-120, class:^(hyprland-run)$

windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = center, class:^(org.gnome.Calculator)$

windowrulev2 = float, class:^(wlogout)$
windowrulev2 = fullscreen, class:^(wlogout)$

windowrulev2 = float, class:^(Swaync)$

windowrulev2 = opacity 0.85 0.7, class:^(.*)$
windowrulev2 = opacity 1.0 1.0, class:^(vlc|mpv|youtube|browser)$

windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$

windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(nm-connection-editor)$

windowrulev2 = suppressevent maximize, class:.*

windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0

layerrule = blur, waybar
layerrule = ignorealpha 0.2, waybar

layerrule = blur, swaync-control-center
layerrule = ignorealpha 0.2, swaync-control-center
layerrule = dimaround, swaync-control-center

layerrule = blur, wlogout
layerrule = ignorealpha 0.5, wlogout

layerrule = blur, rofi
layerrule = ignorealpha 0.2, rofi
layerrule = dimaround, rofi

windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = size 800 500, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$
