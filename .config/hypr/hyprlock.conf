source = ~/.cache/wal/colors-hyprland.conf

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 12
    noise = 0.0117
    contrast = 1.0
    brightness = 0.8
    vibrancy = 0.5
    vibrancy_darkness = 0.2
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $color4
    inner_color = $background
    font_color = $foreground
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##cdd6f4">Input Password...</span></i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = $foreground
    font_size = 150
    font_family = JetBrainsMono Nerd Font Extrabold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.5)
}

label {
    monitor =
    text =    $USER
    color = $foreground
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 5
}
