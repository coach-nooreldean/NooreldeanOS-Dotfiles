<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24"/>
      <stop offset="100%" stop-color="#0f1217"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" stroke="#2b3345" stroke-width="3"/>

  <!-- Base Inactive Track (240 deg sweep, concentric) -->
  <path d="M 63.91 169.0 A 74 74 0 1 1 192.09 169.0" fill="none" stroke="#232a38" stroke-width="14" stroke-linecap="round"/>

  <!-- Active Speed Arc (perfectly concentric, large-arc-flag=0) -->
  <path d="M 63.91 169.0 A 74 74 0 0 1 184.69 84.43" fill="none" stroke="url(#arcGrad)" stroke-width="14" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Arc Tip Glow Dot -->
  <circle cx="184.69" cy="84.43" r="7" fill="#a855f7" filter="url(#softGlow)"/>
  <circle cx="184.69" cy="84.43" r="3.5" fill="#ffffff"/>

  <!-- Gauge Ticks -->
  <line x1="74.31" y1="163.0" x2="81.23" y2="159.0" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="66.15" y1="127.68" x2="74.13" y2="128.23" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="79.14" y1="93.83" x2="85.45" y2="98.75" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="108.84" y1="73.03" x2="111.31" y2="80.64" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="128.0" y1="70.0" x2="128.0" y2="78.0" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="145.09" y1="72.4" x2="142.88" y2="80.09" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="175.49" y1="92.15" x2="169.37" y2="97.29" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="189.66" y1="125.52" x2="181.7" y2="126.36" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="181.69" y1="163.0" x2="174.77" y2="159.0" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Hub -->
  <circle cx="128" cy="132" r="14" fill="#1b202c" stroke="#38bdf8" stroke-width="3"/>

  <!-- Needle -->
  <line x1="128" y1="132" x2="170.9" y2="96.0" stroke="url(#needleGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#softGlow)"/>
  <circle cx="128" cy="132" r="6" fill="#f43f5e"/>

  <!-- Speed waves at bottom -->
  <path d="M 98 188 Q 128 178 158 188" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 108 200 Q 128 192 148 200" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>